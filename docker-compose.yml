services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parkit
      POSTGRES_PASSWORD: parkit
      POSTGRES_DB: parkit
    ports:
      # 5433 on the host so it doesn't clash with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkit"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
