AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ParkIt on AWS Academy Cloud Foundations Sandbox (us-east-1).
  One EC2 server (Nginx + Node API + built React app), one RDS PostgreSQL database,
  one private S3 bucket for QR images, and (optional) one SNS topic for booking emails.
  Everything is created by this one template.

# -----------------------------------------------------------------------------
# Parameters: the only things you type in when you create the stack.
# -----------------------------------------------------------------------------
Parameters:
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 40
    AllowedPattern: "[A-Za-z0-9_.-]*"
    ConstraintDescription: 8-40 characters, only letters, digits, underscore, dot or dash.
    Description: >
      Password for the database user. Letters, digits, _ . - only (it is placed inside a
      connection URL, so characters like / @ " or spaces are not allowed).

  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 40
    AllowedPattern: "[A-Za-z0-9_.-]*"
    ConstraintDescription: 8-40 characters, only letters, digits, underscore, dot or dash.
    Description: >
      Password for the ParkIt admin login. Letters, digits, _ . - only. It MUST NOT be
      admin12345: the seed script refuses the development password outside development.

  AdminEmail:
    Type: String
    Default: admin@parkit.local
    AllowedPattern: "[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+"
    Description: Email used to log in as admin.

  RepoUrl:
    Type: String
    Default: https://github.com/Harbani007/ParkIt.git
    Description: Public Git repository to deploy.

  Branch:
    Type: String
    Default: main
    Description: Branch to deploy.

  NodeVersion:
    Type: String
    Default: "22.14.0"
    Description: Node.js 22.x version downloaded from nodejs.org (Amazon Linux's own Node is too old).

  BookingEmails:
    Type: String
    Default: "no"
    AllowedValues: ["yes", "no"]
    Description: >
      yes = create an SNS topic and email customers when a booking is confirmed or cancelled
      (each customer first gets an AWS "Subscription Confirmation" email to click).
      If stack creation fails on the SNS topic, delete the stack and create it again with no.

  OwnerEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+"
    Description: >
      Optional, used only when BookingEmails is yes. A real inbox (yours) that receives a copy
      of every booking email. Leave empty for none.

  # Latest Amazon Linux 2023 image. AWS publishes the current AMI id in this public
  # SSM parameter, so we never hard-code an AMI id.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Leave as is.

Conditions:
  EmailsOn: !Equals [!Ref BookingEmails, "yes"]
  OwnerCopy: !And
    - !Condition EmailsOn
    - !Not [!Equals [!Ref OwnerEmail, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Firewall for the web server: anyone on the internet may reach port 80 (HTTP).
  # No SSH port at all; for debugging use Session Manager (EC2 -> Connect).
  # No VpcId given, so it goes into the account's default VPC.
  # ---------------------------------------------------------------------------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ParkIt web server - HTTP only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # ---------------------------------------------------------------------------
  # Firewall for the database: only machines in the web server's security group
  # may connect, and only on the PostgreSQL port 5432.
  # ---------------------------------------------------------------------------
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ParkIt database - PostgreSQL from the web server only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt WebSecurityGroup.GroupId

  # ---------------------------------------------------------------------------
  # The database. PostgreSQL (RDS default version) on db.t3.micro (burstable, allowed in the sandbox).
  # Not public, single AZ, no Enhanced Monitoring (the sandbox forbids it).
  # No subnet group named, so RDS uses the default VPC's default subnet group.
  # ---------------------------------------------------------------------------
  DB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      Engine: postgres   # no EngineVersion: RDS picks its current default PostgreSQL version
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      StorageType: gp2
      DBName: parkit
      MasterUsername: parkit_admin
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: false
      MultiAZ: false
      MonitoringInterval: 0
      BackupRetentionPeriod: 1
      DeletionProtection: false
      VPCSecurityGroups:
        - !GetAtt DbSecurityGroup.GroupId

  # ---------------------------------------------------------------------------
  # Private S3 bucket for the QR code images. Name is generated by CloudFormation.
  # Nothing public; objects are encrypted; the app hands out 15-minute signed links.
  # ---------------------------------------------------------------------------
  QrBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------------------------------------------------------------------------
  # Booking emails (only when BookingEmails = yes). The app subscribes each customer's
  # email with a filter policy on their own address and tags every message with the
  # customer's email, so each customer only receives their own bookings. The owner's
  # subscription has no filter, so it receives every message.
  # ---------------------------------------------------------------------------
  BookingTopic:
    Type: AWS::SNS::Topic
    Condition: EmailsOn
    Properties:
      TopicName: !Sub "${AWS::StackName}-bookings"
      DisplayName: ParkIt

  OwnerSubscription:
    Type: AWS::SNS::Subscription
    Condition: OwnerCopy
    Properties:
      TopicArn: !Ref BookingTopic
      Protocol: email
      Endpoint: !Ref OwnerEmail

  # ---------------------------------------------------------------------------
  # The web server. It uses the sandbox's ready-made LabInstanceProfile (role LabRole),
  # which is how the app gets S3 access without any access keys.
  # CreationPolicy: CloudFormation waits (up to 25 min) for the script at the bottom of
  # UserData to send a "success" signal, which it only does once /api/health says db up.
  # ---------------------------------------------------------------------------
  WebServer:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT25M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: vockey
      IamInstanceProfile: LabInstanceProfile
      SecurityGroupIds:
        - !GetAtt WebSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp2
      Tags:
        - Key: Name
          Value: parkit-web
      # The setup script that runs once, as root, on first boot. Everything is logged to
      # /var/log/parkit-setup.log. (${!x} is how CloudFormation writes a literal ${x} for bash.)
      UserData:
        Fn::Base64: !Sub
          - |
              #!/bin/bash
              set -euxo pipefail
              exec > >(tee -a /var/log/parkit-setup.log) 2>&1
              export HOME=/root
              export PATH=/usr/local/bin:$PATH

              # If anything below fails, tell CloudFormation straight away so the stack fails
              # fast instead of waiting 25 minutes. Check the log file named above.
              trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}' ERR

              # 1. Packages
              dnf install -y git nginx aws-cfn-bootstrap

              # 2. A little swap so npm/vite do not run out of memory on a 1 GB machine
              dd if=/dev/zero of=/swapfile bs=1M count=1024
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile

              # 3. Node.js from nodejs.org (pinned version)
              curl -fsSL https://nodejs.org/dist/v${NodeVersion}/node-v${NodeVersion}-linux-x64.tar.xz -o /tmp/node.tar.xz
              mkdir -p /usr/local/lib/nodejs
              tar -xJf /tmp/node.tar.xz -C /usr/local/lib/nodejs
              ln -sf /usr/local/lib/nodejs/node-v${NodeVersion}-linux-x64/bin/node /usr/local/bin/node
              ln -sf /usr/local/lib/nodejs/node-v${NodeVersion}-linux-x64/bin/npm /usr/local/bin/npm
              ln -sf /usr/local/lib/nodejs/node-v${NodeVersion}-linux-x64/bin/npx /usr/local/bin/npx
              node --version

              # 4. Get the code and build it
              git clone --depth 1 --branch ${Branch} ${RepoUrl} /opt/parkit
              cd /opt/parkit/frontend
              npm ci
              npm run build
              cd /opt/parkit/backend
              npm ci --omit=dev

              # 5. Settings file, readable by root only. The JWT secret is invented here and
              #    never leaves this machine.
              umask 077
              JWT=$(openssl rand -hex 32)
              cat > /etc/parkit.env <<EOF
              NODE_ENV=production
              PORT=4000
              DATABASE_URL=postgres://parkit_admin:${DbPassword}@${DB.Endpoint.Address}:5432/parkit
              DATABASE_SSL=true
              JWT_SECRET=$JWT
              JWT_EXPIRES_IN=7d
              STORAGE_DRIVER=s3
              S3_ASSETS_BUCKET=${QrBucket}
              AWS_REGION=us-east-1
              TRUST_PROXY=1
              ADMIN_EMAIL=${AdminEmail}
              ADMIN_PASSWORD=${AdminPassword}
              SNS_TOPIC_ARN=${SnsTopicArn}
              EOF
              chmod 600 /etc/parkit.env
              umask 022

              # 6. Create the tables and the demo data (reads the settings file)
              set -a
              . /etc/parkit.env
              set +a
              cd /opt/parkit/backend
              node src/db/migrate.js
              node src/db/seed.js

              # 7. Run the API as a normal (non-root) user, restarted automatically if it dies
              useradd --system --no-create-home --shell /sbin/nologin parkit
              cat > /etc/systemd/system/parkit-api.service <<'EOF'
              [Unit]
              Description=ParkIt API
              After=network-online.target

              [Service]
              User=parkit
              WorkingDirectory=/opt/parkit/backend
              EnvironmentFile=/etc/parkit.env
              ExecStart=/usr/local/bin/node src/server.js
              Restart=always
              RestartSec=3

              [Install]
              WantedBy=multi-user.target
              EOF
              systemctl daemon-reload
              systemctl enable --now parkit-api

              # 8. Nginx: serve the built website, send /api/ to the Node API
              mkdir -p /usr/share/nginx/parkit
              cp -r /opt/parkit/frontend/dist/. /usr/share/nginx/parkit/
              cat > /etc/nginx/nginx.conf <<'EOF'
              user nginx;
              worker_processes auto;
              pid /run/nginx.pid;
              events { worker_connections 512; }
              http {
                include /etc/nginx/mime.types;
                default_type application/octet-stream;
                server {
                  listen 80 default_server;
                  root /usr/share/nginx/parkit;
                  location /api/ {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                  }
                  location / {
                    try_files $uri /index.html;
                  }
                }
              }
              EOF
              nginx -t
              systemctl enable --now nginx

              # 9. Wait until the app answers and the database is reachable (up to ~5 min)
              ok=0
              for i in $(seq 1 60); do
                if curl -fs http://127.0.0.1/api/health | grep -q '"db":"up"'; then ok=1; break; fi
                sleep 5
              done
              [ "$ok" = "1" ]

              # 10. Tell CloudFormation we are done
              /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}
          - SnsTopicArn: !If [EmailsOn, !Ref BookingTopic, ""]

# -----------------------------------------------------------------------------
# Outputs: shown on the stack's Outputs tab when it finishes.
# -----------------------------------------------------------------------------
Outputs:
  WebsiteURL:
    Description: Open this in your browser (plain http, not https).
    Value: !Sub "http://${WebServer.PublicDnsName}"
  AdminEmail:
    Description: Admin login email (password is the one you typed).
    Value: !Ref AdminEmail
  QrBucket:
    Description: S3 bucket that holds the QR images.
    Value: !Ref QrBucket
  BookingTopic:
    Condition: EmailsOn
    Description: SNS topic for booking emails.
    Value: !Ref BookingTopic
  DatabaseEndpoint:
    Description: RDS address (private; only the web server can reach it).
    Value: !GetAtt DB.Endpoint.Address
  NextSteps:
    Description: What to do now.
    Value: >-
      Open WebsiteURL, register a customer and book a slot, then log in as the admin email
      with your AdminPassword. To debug, EC2 -> parkit-web -> Connect -> Session Manager, then
      run: sudo tail -n 100 /var/log/parkit-setup.log
